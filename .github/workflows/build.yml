# Compiles the app and runs the logic checks on every push to a branch, so a change that doesn't build or breaks a
# check shows up on its pull request before it is merged or released. Nothing is signed or published here.

name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Logic checks and a debug build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      # The screen tests' pictures (Home's total card, Recent transactions, the loading signs), to look at a layout
      # change before it's released. Kept even when a test fails, so the failing screen can be seen too.
      - name: Keep the screen pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore
